packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - react-router-dom@7.18.6
  - react-router@7.18.6

allowBuilds:
  "@prisma/client": false
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: false
  prisma: false
patchedDependencies:
  "@colyseus/sdk@0.17.43": patches/@colyseus__sdk@0.17.43.patch
# Filtered API, game and migration deploys omit the browser SDK.
allowUnusedPatches: true
