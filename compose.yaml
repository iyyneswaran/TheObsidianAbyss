services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: obsidian
      POSTGRES_DB: obsidian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a local PostgreSQL password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - progression-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidian -d obsidian"]
      interval: 3s
      timeout: 4s
      retries: 10
volumes:
  progression-data:
