map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 32k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; media-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  location ^~ /api/ { proxy_pass http://api:3001/; proxy_set_header Host $host; }
  location = /party/connect { proxy_pass http://game:2567; }
  location ^~ /matchmake/ { proxy_pass http://game:2567; }
  location ~ (^|/)[.] { return 404; }
  location ~ ^/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+$ {
    if ($http_upgrade = "") { rewrite ^ /index.html last; }
    proxy_pass http://game:2567;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
  location ~* "^/assets/[^/]+-[a-zA-Z0-9_-]{8,}[.](js|css)$" { expires 1y; try_files $uri =404; }
  location /assets/ { expires -1; try_files $uri =404; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
